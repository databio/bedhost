# Alembic config for running bbconf migrations against the LOCAL dev Postgres.
# Usage (from the bedhost repo, with the dev venv):
#   .venv/bin/alembic -c deployment/dev/alembic.dev.ini upgrade head
# Assumes bbconf is cloned next to bedhost (../bbconf). %(here)s is this file's
# directory, so this works from any working directory.
[alembic]
script_location = %(here)s/../../../bbconf/bbconf/alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+psycopg://bedbase:bedbase@127.0.0.1:15443/bedbase

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
